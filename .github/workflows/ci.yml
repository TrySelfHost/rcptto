name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test & vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
      - name: gofmt
        run: |
          files=$(find . -name '*.go' -not -path './vendor/*')
          unformatted=$(gofmt -l $files)
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            echo 'run gofmt -w .'
            exit 1
          fi
      - name: vet
        run: go vet ./...
      - name: test (race + coverage)
        run: go test -race -covermode=atomic -coverprofile=coverage.txt ./...
      - name: build
        run: go build ./...

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2

  integration:
    name: integration (postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rcptto
          POSTGRES_PASSWORD: rcptto
          POSTGRES_DB: rcptto
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rcptto"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
      - name: integration tests
        run: go test -tags=integration ./internal/store/postgres/...
        env:
          DATABASE_URL: postgres://rcptto:rcptto@localhost:5432/rcptto?sslmode=disable
