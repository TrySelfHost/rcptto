{{define "content-home"}}
<h1>Verify an address</h1>
<div class="card">
  <form hx-post="/verify" hx-target="#result" hx-swap="innerHTML">
    <div class="row">
      <input type="email" name="email" placeholder="someone@example.com" required autofocus>
      <button type="submit">Verify</button>
    </div>
  </form>
  <div id="result" style="margin-top:1rem"></div>
</div>

<h2>Upload a list</h2>
<div class="card">
  <form hx-post="/upload" hx-target="#upload-result" hx-swap="innerHTML"
        hx-encoding="multipart/form-data" class="stack">
    <input type="file" name="file" accept=".csv,.xlsx,.xlsm,.tsv,.txt" required>
    <div class="hint">
      CSV or XLSX. Columns for the client name and email address are detected
      automatically; you confirm the mapping before anything is verified.
    </div>
    <div><button type="submit">Read file</button></div>
  </form>
  <div id="upload-result" style="margin-top:1rem"></div>
</div>

{{end}}
