{{define "upload-preview"}}
<div class="stack">
  <div>
    <strong>{{.Filename}}</strong>
    <span class="muted">— {{.Total}} row{{if ne .Total 1}}s{{end}} ready to verify</span>
  </div>

  <form hx-post="/upload/confirm" hx-target="#job-create-result" hx-swap="innerHTML" class="stack">
    <input type="hidden" name="token" value="{{.Token}}">
    <div class="row">
      <label class="stack" style="flex:1">
        <span class="hint">Email column</span>
        <select name="email_col">
          {{range $c := .Columns}}
          <option value="{{$c}}" {{if eq $c $.EmailCol}}selected{{end}}>{{columnName $.Header $c}}</option>
          {{end}}
        </select>
      </label>
      <label class="stack" style="flex:1">
        <span class="hint">Client name column</span>
        <select name="label_col">
          <option value="-1" {{if lt $.LabelCol 0}}selected{{end}}>(none)</option>
          {{range $c := .Columns}}
          <option value="{{$c}}" {{if eq $c $.LabelCol}}selected{{end}}>{{columnName $.Header $c}}</option>
          {{end}}
        </select>
      </label>
    </div>

    <details>
      <summary class="hint" style="cursor:pointer">Sample of the first few rows</summary>
      <table style="margin-top:.6rem">
        <tr>{{range $c := .Columns}}<th>{{columnName $.Header $c}}</th>{{end}}</tr>
        {{range $row := .Rows}}
        <tr>{{range $c := $.Columns}}<td class="mono">{{cell $row $c}}</td>{{end}}</tr>
        {{end}}
      </table>
    </details>

    <div><button type="submit">Verify {{.Total}} row{{if ne .Total 1}}s{{end}}</button></div>
  </form>
</div>
{{end}}
