# Local Postgres for development and integration tests.
#
#   docker compose -f deploy/compose/docker-compose.postgres.yml up -d
#   export DATABASE_URL='postgres://rcptto:rcptto@localhost:5432/rcptto?sslmode=disable'
#   go run ./cmd/rcptto-server                       # server uses Postgres + auto-migrates
#   go test -tags=integration ./internal/store/postgres/...
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: rcptto
      POSTGRES_PASSWORD: rcptto
      POSTGRES_DB: rcptto
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rcptto"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - rcptto_pgdata:/var/lib/postgresql/data

volumes:
  rcptto_pgdata:
