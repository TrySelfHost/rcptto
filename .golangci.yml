# golangci-lint configuration (v2 schema) for rcpttō.
# Run: golangci-lint run
version: "2"

run:
  timeout: 5m

linters:
  default: standard   # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - misspell
    - revive
    - gocritic
    - bodyclose
    - noctx
    - errorlint
    - unconvert
    - prealloc
    - nolintlint
  settings:
    revive:
      rules:
        - name: exported
    misspell:
      locale: US
  exclusions:
    rules:
      - path: _test\.go
        linters: [errcheck, bodyclose]
      - linters: [revive]
        text: "exported const .* should have comment"
      - linters: [revive]
        text: "comment on exported const .* should be of the form"

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/tryselfhost/rcptto
